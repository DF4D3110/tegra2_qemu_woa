name: Build Tegra2 QEMU (AMD64)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows-amd64:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout quadcore 分支
      uses: actions/checkout@main
      with:
        ref: quadcore

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git make bison diffutils flex grep sed base-devel
        pacboy: >-
          toolchain:p binutils:p capstone:p ccache:p curl:p
          cyrus-sasl:p dtc:p gcc:p glib2:p gnutls:p gtk3:p
          libgcrypt:p libjpeg-turbo:p libnfs:p libpng:p
          libssh:p libtasn1:p libusb:p lzo2:p nettle:p
          ninja:p pixman:p pkgconf:p SDL2:p SDL2_image:p
          snappy:p spice:p usbredir:p zstd:p libslirp:p

    - name: 安装 Python 和 pip
      run: |
        pacman -S --noconfirm \
          mingw-w64-x86_64-python \
          mingw-w64-x86_64-python-pip \
          mingw-w64-x86_64-python-setuptools \
          mingw-w64-x86_64-python-wheel

    - name: 验证 Python 环境
      run: |
        python3 --version
        python3 -m pip --version

    - name: 配置 QEMU (禁用 libnfs)
      run: |
        ./configure --target-list=arm-softmmu \
                    --enable-whpx \
                    --enable-gtk \
                    --enable-slirp \
                    --enable-sdl \
                    --disable-werror \
                    --disable-libnfs

    - name: 编译 (仅主程序)
      run: |
        make qemu-system-arm.exe -j$(nproc)

    - name: 准备产物
      shell: cmd
      run: |
        mkdir artifacts-amd64
        if exist build\qemu-system-arm.exe copy build\qemu-system-arm.exe artifacts-amd64\
        if exist build\pc-bios robocopy build\pc-bios artifacts-amd64\pc-bios /E
        echo 此版本适用于 Windows x86_64 (AMD64) > artifacts-amd64\README.txt

    - name: 上传产物 (amd64)
      uses: actions/upload-artifact@main
      with:
        name: qemu-tegra2-windows-amd64
        path: artifacts-amd64
        compression-level: 9
