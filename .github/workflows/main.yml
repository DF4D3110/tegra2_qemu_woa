name: Build Tegra2 QEMU (Cross-Platform)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows-amd64:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout quadcore 分支
      uses: actions/checkout@main
      with:
        ref: quadcore

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p

    - name: 安装 Python 和 pip
      run: |
        pacman -S --noconfirm \
          mingw-w64-x86_64-python \
          mingw-w64-x86_64-python-pip \
          mingw-w64-x86_64-python-setuptools \
          mingw-w64-x86_64-python-wheel

    - name: 验证 Python 环境
      run: |
        python3 --version
        python3 -m pip --version

    - name: 配置 QEMU (amd64)
      run: |
        ./configure --target-list=arm-softmmu \
                    --enable-whpx \
                    --enable-gtk \
                    --enable-slirp \
                    --enable-sdl \
                    --disable-werror \
                    --disable-tests

    - name: 编译 (仅主程序)
      run: |
        make qemu-system-arm.exe -j$(nproc)

    - name: 准备产物
      shell: cmd
      run: |
        mkdir artifacts-amd64
        copy build\qemu-system-arm.exe artifacts-amd64\
        robocopy build\pc-bios artifacts-amd64\pc-bios /E
        echo 此版本适用于 Windows x86_64 (AMD64) > artifacts-amd64\README.txt

    - name: 上传产物 (amd64)
      uses: actions/upload-artifact@main
      with:
        name: qemu-tegra2-windows-amd64
        path: artifacts-amd64
        compression-level: 9

  build-windows-arm64:
    name: Windows ARM64 (交叉编译)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout quadcore 分支
      uses: actions/checkout@main
      with:
        ref: quadcore

    - name: Setup MSYS2 (使用 mingw64 环境进行交叉编译)
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p

    - name: 安装 ARM64 交叉编译工具链
      run: |
        pacman -S --noconfirm \
          mingw-w64-x86_64-aarch64-mingw32-gcc \
          mingw-w64-x86_64-aarch64-mingw32-binutils

    - name: 验证 Python 环境
      run: |
        python3 --version
        python3 -m pip install --upgrade pip setuptools wheel

    - name: 配置 QEMU (ARM64 交叉编译)
      run: |
        ./configure --target-list=arm-softmmu \
                    --enable-gtk \
                    --enable-slirp \
                    --enable-sdl \
                    --disable-werror \
                    --disable-tests \
                    --cross-prefix=aarch64-w64-mingw32-

    - name: 编译 (仅主程序)
      run: |
        make qemu-system-arm.exe -j$(nproc)

    - name: 准备产物
      shell: cmd
      run: |
        mkdir artifacts-arm64
        copy build\qemu-system-arm.exe artifacts-arm64\
        robocopy build\pc-bios artifacts-arm64\pc-bios /E
        echo 此版本适用于 Windows ARM64 (交叉编译) > artifacts-arm64\README.txt

    - name: 上传产物 (arm64)
      uses: actions/upload-artifact@main
      with:
        name: qemu-tegra2-windows-arm64
        path: artifacts-arm64
        compression-level: 9
